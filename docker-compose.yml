services:
  db:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: gespers
      POSTGRES_PASSWORD: gespers
      POSTGRES_DB: gespers
    ports:
      - "5432:5432"
    volumes:
      - db_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 5s
      timeout: 5s
      retries: 12

  migrate:
    build:
      context: .
      dockerfile: apps/api/Dockerfile
      target: dev
    command: ["pnpm", "--filter", "api", "db:migrate"]
    environment:
      DATABASE_URL: postgresql://gespers:gespers@db:5432/gespers?schema=public
    depends_on:
      db:
        condition: service_healthy
    restart: "no"

  backup:
    image: postgres:17-alpine
    environment:
      PGHOST: db
      PGPORT: "5432"
      PGUSER: gespers
      PGPASSWORD: gespers
      PGDATABASE: gespers
    volumes:
      - db_backups:/backups
    depends_on:
      db:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
    entrypoint: ["/bin/sh", "-c"]
    command:
      - |
        set -eu
        while true; do
          file="/backups/gespers-$$(date -u +%Y%m%dT%H%M%SZ).dump"
          pg_dump --format=custom --file="$$file"
          dropdb --if-exists gespers_restore_test
          createdb gespers_restore_test
          pg_restore --exit-on-error --no-owner --dbname=gespers_restore_test "$$file"
          psql --dbname=gespers_restore_test --set=ON_ERROR_STOP=1 \
            --command="SELECT to_regclass('public.Personnes') IS NOT NULL" >/dev/null
          dropdb gespers_restore_test
          find /backups -type f -name 'gespers-*.dump' -mtime +14 -delete
          echo "[backup] sauvegarde créée et restauration vérifiée : $$file"
          sleep 86400
        done
    restart: unless-stopped

  api:
    build:
      context: .
      dockerfile: apps/api/Dockerfile
      target: dev
    ports:
      - "3001:3001"
    environment:
      PORT: "3001"
      UPLOAD_DIR: /app/apps/api/uploads
      DATABASE_URL: postgresql://gespers:gespers@db:5432/gespers?schema=public
    depends_on:
      db:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
    volumes:
      - ./apps/api/src:/app/apps/api/src
      - ./apps/api/prisma:/app/apps/api/prisma
      - api_uploads:/app/apps/api/uploads

  web:
    build:
      context: .
      dockerfile: apps/web/Dockerfile
      target: dev
    ports:
      - "3000:3000"
    environment:
      NEXT_PUBLIC_API_URL: http://localhost:3001
    depends_on:
      - api
    volumes:
      - ./apps/web:/app/apps/web
      - web_node_modules:/app/apps/web/node_modules
      - web_next:/app/apps/web/.next

volumes:
  db_data:
  db_backups:
  api_uploads:
  web_node_modules:
  web_next:
