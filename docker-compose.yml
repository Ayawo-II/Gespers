services:
  db:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: gespers
      POSTGRES_PASSWORD: gespers
      POSTGRES_DB: gespers
    ports:
      - "5432:5432"
    volumes:
      - db_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 5s
      timeout: 5s
      retries: 12

  migrate:
    build:
      context: .
      dockerfile: apps/api/Dockerfile
      target: dev
    command: ["pnpm", "--filter", "api", "db:migrate"]
    environment:
      DATABASE_URL: postgresql://gespers:gespers@db:5432/gespers?schema=public
    depends_on:
      db:
        condition: service_healthy
    restart: "no"

  api:
    build:
      context: .
      dockerfile: apps/api/Dockerfile
      target: dev
    ports:
      - "3001:3001"
    environment:
      PORT: "3001"
      DATABASE_URL: postgresql://gespers:gespers@db:5432/gespers?schema=public
    depends_on:
      db:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
    volumes:
      - ./apps/api/src:/app/apps/api/src
      - ./apps/api/prisma:/app/apps/api/prisma

  web:
    build:
      context: .
      dockerfile: apps/web/Dockerfile
      target: dev
    ports:
      - "3000:3000"
    environment:
      NEXT_PUBLIC_API_URL: http://localhost:3001
    depends_on:
      - api
    volumes:
      - ./apps/web:/app/apps/web
      - web_node_modules:/app/apps/web/node_modules
      - web_next:/app/apps/web/.next

volumes:
  db_data:
  web_node_modules:
  web_next:
